<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancella l'account · Gifty</title>
<link rel="stylesheet" href="sistema.css">
<style>
  .colonna { max-width: 640px; padding-top: var(--s4); }
  .colonna h1 { margin: var(--s4) 0 var(--s6); }
  .blocco { display: grid; gap: var(--s3); padding: var(--s6) 0; border-top: 1px solid var(--line); }
  .voci { display: grid; }
  .voci li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; }
  .voci li + li { border-top: 1px solid var(--line); }
  .voci svg { width: 20px; height: 20px; margin-top: 2px; color: var(--muted); }
  .voci b { display: block; }
  .voci span.s { color: var(--muted); font-size: 14px; }
  .resta svg { color: var(--green); }
  .conferma { display: grid; gap: var(--s4); padding: var(--s6) 0 0; border-top: 1px solid var(--line); }
  .conferma .avanti { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }
  .errore-box { display: flex; gap: var(--s2); align-items: flex-start; color: var(--error); font-weight: 600; }
  .errore-box svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
  .fatto { display: grid; gap: var(--s5); justify-items: start; padding: var(--s12) 0; }
  .fatto .carta { width: 240px; padding: var(--s5); transform: rotate(-2deg); display: grid; gap: var(--s2); }
  .fatto .carta .mano { font-size: 28px; line-height: 1.05; }
  .riaccedi p { margin: var(--s2) 0 var(--s5); }
  .riaccedi .scelte { display: grid; gap: var(--s3); }
  @media (max-width: 767px) { .conferma .avanti .btn-pericolo { width: 100%; } }
</style>
</head>
<body data-sezione="account" data-piede="no" data-stati="Che cosa sparisce=stato=riepilogo,Accedi di nuovo=stato=riaccedi,In corso=stato=incorso,Errore=stato=errore,Cancellato=stato=fatto&ospite=1">
<main>
  <div class="pagina colonna" id="p"></div>
</main>
<div id="fogli"></div>
<script src="comuni.js"></script>
<script>
  const st = STATO.get("stato") || "riepilogo";
  const v = (ic, b, s) => `<li>${icona(ic)}<span><b>${b}</b>${s ? `<span class="s">${s}</span>` : ""}</span></li>`;
  const google = `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2 3.1v2.6h3.3c1.9-1.8 3.1-4.4 3.1-7.5Z"/><path fill="#34A853" d="M12 22c2.8 0 5.1-.9 6.8-2.5l-3.3-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.8v2.7A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.8a10 10 0 0 0 0 9.2l3.4-2.7Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.9.5 4 1.5l3-3A10 10 0 0 0 2.8 7.1l3.4 2.7C7 7.8 9.3 6 12 6Z"/></svg>`;
  const pulsante = st === "incorso"
    ? `<button class="btn btn-pericolo" aria-busy="true" disabled>Cancellazione in corso</button>`
    : `<a class="btn btn-pericolo" href="?stato=riaccedi">${st === "errore" ? "Riprova" : "Cancella l'account"}</a>`;
  document.getElementById("p").innerHTML = st === "fatto"
    ? `<div class="fatto"><div class="carta" aria-hidden="true"><p class="mano">Ciao Cri</p><p class="t-piccolo muted">5 novembre 2026, 18:40</p></div>
        <h1 class="t-pagina" style="margin:0">Il tuo account è cancellato</h1>
        <p>Abbiamo cancellato i tuoi dati il 5 novembre 2026 alle 18:40. Puoi tornare quando vuoi con un account nuovo.</p>
        <a class="btn btn-primario" href="home.html">Torna alla home</a></div>`
    : `<a class="btn btn-quieto" href="mio-account.html" style="margin-left:-4px">${icona("sx")}Il mio account</a>
      <h1 class="t-pagina">Cancella il tuo account</h1>
      <section class="blocco" aria-labelledby="t-via"><h2 id="t-via" class="t-titolo">Che cosa cancelliamo</h2><ul class="voci">
        ${v("account", "Nome, email e accesso con Google", "")}
        ${v("cuore", "3 preferiti e 3 ricorrenze", "")}
        ${v("regalo", "Il regalo per Mauro, che organizzi", "Si chiude: Luca, Sara e Davide lo vedono chiuso nel loro account")}
        ${v("biglietto", "Il biglietto per Marta", "Il link che hai mandato non si apre più")}
        ${v("voto", "Il tuo voto e il tuo messaggio nel regalo per Elena", "")}
      </ul></section>
      <section class="blocco resta" aria-labelledby="t-resta"><h2 id="t-resta" class="t-titolo">Che cosa resta</h2><ul class="voci">
        ${v("gruppo", "Il tuo nome e la quota nel regalo per Elena", "Marco li vede ancora, per chiudere il conto dei rimborsi")}
      </ul></section>
      <div class="conferma">
        <p>Lo cancelliamo subito e non si può annullare.</p>
        ${st === "errore" ? `<p class="errore-box" role="alert">${icona("chiudi")}L'account non è stato cancellato: l'accesso non è riuscito.</p>` : ""}
        <div class="avanti">${pulsante}<a class="btn btn-quieto" href="mio-account.html">Annulla</a></div>
      </div>`;
  if (st === "riaccedi") document.getElementById("fogli").innerHTML = `<div class="velo"><div class="foglio riaccedi" role="dialog" aria-modal="true" aria-labelledby="t-ri">
      <div class="foglio-testa"><h2 id="t-ri" class="t-sezione">Accedi di nuovo per confermare</h2><a class="icona-btn" href="?stato=riepilogo" aria-label="Chiudi">${icona("chiudi")}</a></div>
      <p>Lo chiediamo per essere sicuri che sia tu.</p>
      <div class="scelte"><a class="btn btn-google" href="?stato=fatto&ospite=1">${google}Accedi con Google e cancella</a></div></div></div>`;
</script>
</body>
</html>
