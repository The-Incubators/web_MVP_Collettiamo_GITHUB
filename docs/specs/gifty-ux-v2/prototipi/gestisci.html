<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il regalo di gruppo per Mauro · Gifty</title>
<link rel="stylesheet" href="sistema.css">
<style>
  .intesta { background: var(--wall); padding: var(--s8) 0 var(--s8); }
  .intesta-in { display: grid; gap: var(--s4); }
  .intesta .meta { color: var(--muted); }
  .intesta .meta b { color: var(--ink); }
  .cifre { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: var(--s4); border-top: 1px solid var(--line-strong); }
  .cifre div { padding: var(--s3) var(--s4) var(--s3) 0; border-bottom: 1px solid var(--line); }
  .cifre dt { font-size: 14px; color: var(--muted); }
  .cifre dd { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 24px; color: var(--green); display: flex; align-items: center; gap: var(--s2); }
  .cifre dd small { font-family: var(--f-text); font-size: 16px; font-weight: 600; color: var(--muted); }
  .cifre .icona-btn { width: 44px; height: 44px; margin: -12px 0; }
  @media (min-width: 768px) { .cifre { grid-template-columns: repeat(4, auto); justify-content: start; column-gap: var(--s10); border-bottom: 0; } .cifre div { border-bottom: 0; padding-right: 0; } }
  .corpo { display: grid; gap: var(--s10); padding-top: var(--s8); }
  @media (min-width: 1000px) { .corpo { grid-template-columns: minmax(0, 1fr) 360px; gap: var(--s12); } }
  .blocco { display: grid; gap: var(--s4); align-content: start; }
  .blocco + .blocco { padding-top: var(--s8); border-top: 1px solid var(--line); }
  .lato { display: grid; gap: 0; align-content: start; }
  .persona { display: grid; grid-template-columns: 36px 1fr auto; gap: var(--s1) var(--s3); align-items: center; padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .persona .n { font-weight: 700; }
  .persona .sub { grid-column: 2; font-size: 14px; color: var(--muted); }
  .persona .saldo { grid-row: 1 / span 2; grid-column: 3; text-align: right; }
  .persona .saldo b { display: block; font-family: var(--f-display); font-size: 20px; color: var(--green); }
  .persona .saldo span { font-size: 14px; color: var(--muted); }
  .persona .azione { grid-column: 2 / -1; display: flex; gap: var(--s2); flex-wrap: wrap; }
  .persona .azione .btn { min-height: 44px; }
  .registro { display: none; }
  @media (min-width: 768px) { .registro { display: table; } .persone-tel { display: none; } }
  .registro td .chi { display: flex; align-items: center; gap: var(--s3); font-weight: 700; }
  .registro td .chi small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
  .registro .btn { min-height: 44px; font-size: 14px; padding: 0 var(--s3); white-space: nowrap; }
  .registro tfoot td { font-weight: 700; border-bottom: 0; }
  .posti { display: flex; gap: 6px; flex-wrap: wrap; }
  .posti .iniziali { width: 32px; height: 32px; font-size: 12px; }
  .regalo-riga { display: grid; grid-template-columns: 88px 1fr; gap: var(--s4); align-items: center; }
  .regalo-riga .lastra { width: 88px; border-radius: 14px; }
  .voti { display: grid; gap: var(--s4); }
  .voto { display: grid; grid-template-columns: 56px 1fr; gap: var(--s2) var(--s3); align-items: center; }
  .voto .lastra { width: 56px; border-radius: 10px; grid-row: span 2; }
  .voto .n { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .voto .barra { display: flex; align-items: center; gap: var(--s2); }
  .voto .barra i { height: 10px; border-radius: 0 4px 4px 0; background: var(--green); display: block; }
  .voto .barra span { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .lato .btn { justify-self: start; }
</style>
</head>
<body data-sezione="gruppo" data-stati="Adesioni aperte=stato=aperto,Votazione=stato=voto,Consegnato=stato=consegnato">
<main>
  <section class="intesta"><div class="pagina intesta-in" id="intesta"></div></section>
  <div class="pagina corpo">
    <div class="blocco" id="persone"></div>
    <aside class="lato" id="lato"></aside>
  </div>
</main>
<script src="comuni.js"></script>
<script>
  const st = STATO.get("stato") || "aperto";
  const cons = st === "consegnato";
  const quota = cons ? 20.71 : 10;
  const P = cons
    ? [["Cri", "c1", "tu", quota, quota, quota], ["Marco", "c2", "", quota, quota, 0], ["Giulia", "c3", "", quota, quota, quota], ["Sara", "c4", "", quota, 10, 10], ["Luca", "c6", "", quota, 0, 0], ["Elena", "c7", "", quota, quota, quota], ["Davide", "c5", "", quota, quota, quota], ["Paolo", "c8", "aggiunto da te", quota, 0, 0]]
    : [["Cri", "c1", "tu", quota, quota, quota], ["Marco", "c2", "", quota, quota, 0], ["Giulia", "c3", "", quota, 0, 0], ["Paolo", "c8", "aggiunto da te", quota, 5, 5]];
  const ricevuto = P.reduce((s, p) => s + p[5], 0);
  const budget = quota * P.length;
  const daRicevere = budget - ricevuto;

  document.getElementById("intesta").innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <h1 class="t-pagina">Il regalo di gruppo per Mauro</h1>
      ${cons ? `<span class="stato caldo">${icona("spunta")}Regalo consegnato il 14 dicembre</span>` : `<span class="stato">Adesioni aperte fino al 12 dicembre, 20:00</span>`}
    </div>
    <p class="meta">Compleanno, 14 dicembre. Organizzato da <b>Cri</b></p>
    <dl class="cifre">
      <div><dt>Iscritti</dt><dd>${P.filter((p) => p[2] !== "aggiunto da te").length} <small>su 10</small></dd></div>
      <div><dt>Quota a testa</dt><dd>${euro(quota)}<button class="icona-btn" aria-label="Cambia la quota a testa">${icona("matita")}</button></dd></div>
      <div><dt>Ricevuto</dt><dd>${euro(ricevuto)}</dd></div>
      <div><dt>Da ricevere</dt><dd>${euro(daRicevere)}</dd></div>
    </dl>`;

  const sottotitolo = (p) => {
    const [n, c, nota, q, d, r] = p;
    if (r >= q) return "Ha pagato, ricevuto";
    if (d > r) return `Dice di aver pagato ${euro(d - r)}`;
    if (r > 0) return `Ricevuto ${euro(r)}`;
    return cons ? "Non ha ancora pagato" : "Ha aderito";
  };
  const azione = (p, tel) => {
    const [n, c, nota, q, d, r] = p;
    if (r >= q) return "";
    if (d > r) return `<button class="btn btn-contorno">Segna ricevuto ${euro(d - r)}</button>`;
    if (nota) return `<button class="btn btn-quieto">Segna un pagamento</button>`;
    if (cons) return `<button class="btn btn-quieto">${icona("campanella")}Promemoria</button>`;
    return "";
  };
  const nome = (p) => `${p[0]}${p[2] ? ` <small>${p[2]}</small>` : ""}`;
  const daSoll = P.filter((p) => p[5] < p[3] && !p[2] && p[4] <= p[5]).length;

  document.getElementById("persone").innerHTML = `
    <div class="testa-sezione" style="margin-bottom:0"><h2 class="t-sezione">Persone</h2>
      ${cons ? `<button class="btn btn-primario">${icona("campanella")}Manda un promemoria a ${daSoll} persone</button>` : `<a class="btn btn-primario" href="#">${icona("whatsapp")}Manda il link nella chat</a>`}</div>
    ${cons ? "" : `<div class="posti" aria-label="${P.length} persone su 10">${P.map((p) => `<span class="iniziali ${p[1]}" aria-hidden="true">${p[0].slice(0, 2).toUpperCase()}</span>`).join("")}${'<span class="iniziali vuoto"></span>'.repeat(10 - P.length)}</div>`}
    <table class="registro"><thead><tr><th>Persona</th><th class="num">Quota</th><th class="num">Dichiarato</th><th class="num">Ricevuto</th><th class="num">Saldo</th><th><span class="vh">Azione</span></th></tr></thead>
      <tbody>${P.map((p) => `<tr><td><span class="chi"><span class="iniziali ${p[1]}">${p[0].slice(0, 2).toUpperCase()}</span><span>${p[0]}${p[2] ? `<small>${p[2]}</small>` : ""}</span></span></td>
        <td class="num">${euro(p[3])}</td><td class="num">${p[4] ? euro(p[4]) : "–"}</td><td class="num">${p[5] ? euro(p[5]) : "–"}</td><td class="num"><b>${p[3] - p[5] > 0 ? euro(p[3] - p[5]) : "0 €"}</b></td><td>${azione(p)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td>Totale</td><td class="num">${euro(budget)}</td><td class="num"></td><td class="num">${euro(ricevuto)}</td><td class="num">${euro(daRicevere)}</td><td></td></tr></tfoot></table>
    <div class="persone-tel">${P.map((p) => `<div class="persona"><span class="iniziali ${p[1]}">${p[0].slice(0, 2).toUpperCase()}</span><span class="n">${p[0]}${p[2] ? ` <span class="muted" style="font-weight:400">${p[2]}</span>` : ""}</span>
      <span class="saldo"><b>${p[3] - p[5] > 0 ? euro(p[3] - p[5]) : "0 €"}</b><span>saldo</span></span><span class="sub">${sottotitolo(p)}</span>${azione(p) ? `<span class="azione">${azione(p)}</span>` : ""}</div>`).join("")}</div>
    ${cons ? "" : `<div><button class="btn btn-contorno">${icona("piu")}Aggiungi una persona</button></div>`}`;

  const regalo = st === "aperto"
    ? `<div class="blocco"><h2 class="t-sezione">Il regalo</h2><p>Budget previsto <b class="t-cifra">${euro(budget)}</b> con le adesioni di oggi.</p>
        <button class="btn btn-primario">Scegli il regalo</button><button class="btn btn-quieto">${icona("voto")}Metti ai voti più regali</button></div>`
    : st === "voto"
    ? `<div class="blocco"><h2 class="t-sezione">Votazione</h2><div class="voti">
        ${[["PRD-038", 3], ["PRD-044", 1], ["PRD-054", 0]].map(([id, v]) => `<div class="voto"><span class="lastra"><img src="${foto(id)}" alt=""></span><span class="n">${PRODOTTI[id].nome}</span><span class="barra">${v ? `<i style="width:${v * 48}px"></i>` : ""}<span>${v} ${v === 1 ? "voto" : "voti"}</span></span></div>`).join("")}</div>
        <button class="btn btn-primario">Chiudi la votazione</button></div>`
    : `<div class="blocco"><h2 class="t-sezione">Il regalo</h2><div class="regalo-riga"><span class="lastra"><img src="${foto("PRD-038")}" alt=""></span><div><p style="font-weight:700">${PRODOTTI["PRD-038"].nome}</p><p class="t-piccolo muted">Comprato a ${euro(165.64)}, diviso fra 8</p></div></div></div>`;
  const biglietto = cons
    ? `<div class="blocco"><h2 class="t-sezione">Biglietto</h2><p>Firmato da 6 persone, mandato a Mauro</p><a class="btn btn-contorno" href="biglietto-gestisci.html">Apri il biglietto</a></div>`
    : `<div class="blocco"><h2 class="t-sezione">Biglietto</h2><a class="btn btn-contorno" href="biglietto-editor.html?passo=2&gruppo=1">Prepara il biglietto</a></div>`;
  const consegna = cons ? "" : `<div class="blocco"><h2 class="t-sezione">Consegna</h2><button class="btn btn-contorno">${icona("regalo")}Regalo consegnato</button></div>`;
  document.getElementById("lato").innerHTML = regalo + biglietto + consegna;
</script>
</body>
</html>
