<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il regalo di gruppo per Elena · Gifty</title>
<link rel="stylesheet" href="sistema.css">
<style>
  .scena-invito { background: var(--wall); padding: var(--s10) 0 var(--s12); }
  .scena-invito .carta { max-width: 520px; margin: 0 auto; padding: var(--s8) var(--s6) var(--s6); transform: rotate(-1.5deg); display: grid; gap: var(--s3); }
  .scena-invito .mano { font-size: 40px; line-height: 1; }
  .scena-invito .chi { color: var(--muted); }
  .scena-invito .chi b { color: var(--ink); }
  .scena-invito .regalo { display: grid; grid-template-columns: 72px 1fr; gap: var(--s3); align-items: center; margin-top: var(--s2); }
  .scena-invito .regalo .lastra { width: 72px; border-radius: 12px; background: #fff; }
  @media (min-width: 768px) { .scena-invito .mano { font-size: 56px; } .scena-invito .carta { padding: var(--s10) var(--s10) var(--s8); } }
  .colonna { max-width: 560px; margin: 0 auto; }
  .blocco { display: grid; gap: var(--s4); padding: var(--s8) 0; }
  .blocco + .blocco { border-top: 1px solid var(--line); }
  .azioni-scelta { display: grid; gap: var(--s3); margin-top: calc(-1 * var(--s6)); position: relative; z-index: 2; }
  @media (min-width: 768px) { .azioni-scelta { grid-template-columns: 2fr 1fr; } }
  .quota { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .quota .t-cifra { font-size: 40px; color: var(--green); line-height: 1; }
  .metodi { display: grid; gap: 0; }
  .metodi > div { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); min-height: 56px; border-bottom: 1px solid var(--line); }
  .metodi .v { margin-left: auto; overflow-wrap: anywhere; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .opzione { display: grid; grid-template-columns: 24px 64px 1fr; gap: var(--s3); align-items: center; }
  .opzione .lastra { width: 64px; border-radius: 12px; }
  .opzione .n { font-weight: 700; line-height: 1.3; }
</style>
</head>
<body data-sezione="gruppo" data-stati="Anteprima=stato=anteprima,Accesso=stato=accesso,Aderito, voto aperto=stato=aderito,Da pagare=stato=dapagare,Ho pagato=stato=pagato,Chiuso=stato=chiuso">
<main>
  <section class="scena-invito"><div class="pagina"><div class="carta" id="carta"></div></div></section>
  <div class="pagina"><div class="colonna" id="corpo"></div></div>
</main>
<script src="comuni.js"></script>
<script>
  const st = STATO.get("stato") || "anteprima";
  const dentro = ["aderito", "dapagare", "pagato"].includes(st);
  const deciso = st === "dapagare" || st === "pagato";
  document.getElementById("carta").innerHTML = `
    <p class="mano">Il regalo di gruppo per Elena</p>
    <p class="chi">Laurea, 20 dicembre. Organizzato da <b>Marco</b></p>
    ${dentro ? `<div class="fila-iniziali" aria-label="5 su 12 hanno aderito" style="margin-top:8px"><span class="iniziali c2">MA</span><span class="iniziali c1">CR</span><span class="iniziali c3">GI</span><span class="iniziali c4">SA</span><span class="iniziali c6">LU</span></div><p class="t-piccolo muted">5 su 12 hanno aderito</p>${deciso ? `<div class="regalo"><span class="lastra"><img src="${foto("PRD-044")}" alt=""></span><span><b>${PRODOTTI["PRD-044"].nome}</b><br><span class="t-piccolo muted">Ha vinto la votazione</span></span></div>` : ""}`
      : `<p style="margin-top:8px">Il regalo lo scegliamo insieme, votando fra le proposte di Marco.</p>`}`;

  const accesso = `<div class="velo" role="dialog" aria-modal="true" aria-labelledby="t-acc"><div class="foglio">
      <button class="icona-btn chiudi" aria-label="Chiudi">${icona("chiudi")}</button>
      <h2 id="t-acc" class="t-sezione" style="margin-bottom:16px">Accedi per partecipare</h2>
      <div style="display:grid;gap:16px">
        <a class="btn btn-google" href="invito.html?stato=aderito"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2 3.1v2.6h3.3c1.9-1.8 3.1-4.4 3.1-7.5Z"/><path fill="#34A853" d="M12 22c2.8 0 5.1-.9 6.8-2.5l-3.3-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.8v2.7A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.8a10 10 0 0 0 0 9.2l3.4-2.7Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.9.5 4 1.5l3-3A10 10 0 0 0 2.8 7.1l3.4 2.7C7 7.8 9.3 6 12 6Z"/></svg>Accedi con Google</a>
        <div class="campo"><label for="em">Oppure con la tua email</label><input id="em" type="email" class="input" placeholder="nome@esempio.it" autocomplete="email"></div>
        <button class="btn btn-contorno">Mandami il link per accedere</button>
        <p class="t-piccolo muted">Accedendo accetti l'<a href="#">informativa privacy</a>.</p>
      </div></div></div>`;

  const scelta = `<div class="azioni-scelta"><a class="btn btn-primario" href="invito.html?stato=accesso">Partecipo</a><button class="btn btn-contorno">Non partecipo</button></div>`;

  const quota = st === "pagato"
    ? `<div class="blocco"><h2 class="t-sezione">La tua quota</h2><div class="quota"><span class="t-cifra">15,82 €</span><span class="muted">a Marco</span></div>
        <span class="stato neutro" style="justify-self:start">In attesa della conferma di Marco</span></div>`
    : `<div class="blocco"><h2 class="t-sezione">La tua quota</h2><div class="quota"><span class="t-cifra">15,82 €</span><span class="muted">a Marco, fuori da Gifty</span></div>
        <div class="metodi"><div>PayPal<a class="btn btn-quieto" style="margin-left:auto" href="#">Apri PayPal ${icona("esterno")}</a></div>
        <div>Satispay<span class="v">347 000 0001</span><button class="icona-btn" aria-label="Copia il numero Satispay">${icona("copia")}</button></div>
        <div>Bonifico<span class="v">IT60 X054 2811 1010 0000 0123 456</span><button class="icona-btn" aria-label="Copia l'IBAN">${icona("copia")}</button></div></div>
        <button class="btn btn-primario">Ho pagato</button></div>`;
  const voto = `<div class="blocco"><h2 class="t-sezione">Quale regalo?</h2><div role="radiogroup" aria-label="Il tuo voto" style="display:grid;gap:12px">
      ${[["PRD-044", true], ["PRD-094", false]].map(([id, on]) => `<button class="scelta opzione" role="radio" aria-checked="${on}"><span class="radio"></span><span class="lastra"><img src="${foto(id)}" alt=""></span><span><span class="n">${PRODOTTI[id].nome}</span><br><span class="t-cifra muted">${euro(PRODOTTI[id].prezzo)}</span></span></button>`).join("")}
      </div><div><button class="btn btn-quieto">${icona("piu")}Suggerisci un regalo</button></div></div>`;
  const firma = `<div class="blocco"><h2 class="t-sezione">Il biglietto per Elena</h2><a class="btn btn-contorno" href="biglietto-editor.html?passo=2">${icona("matita")}Firma il biglietto</a></div>`;
  const chiuso = `<div class="blocco" style="margin-top:-24px;position:relative;z-index:2"><span class="stato neutro" style="justify-self:start">Le adesioni sono chiuse</span><p>Il regalo è stato consegnato.</p></div>`;

  document.getElementById("corpo").innerHTML =
    st === "anteprima" ? scelta
    : st === "accesso" ? scelta + accesso
    : st === "chiuso" ? chiuso
    : `<div class="blocco" style="padding-bottom:0"><span class="stato" style="justify-self:start">${icona("spunta")}Partecipi al regalo per Elena</span></div>` + (st === "aderito" ? `<div class="blocco"><h2 class="t-sezione">La tua quota</h2><p>La quota si conosce quando Marco chiude la votazione.</p></div>` + voto : quota) + firma;
</script>
</body>
</html>
